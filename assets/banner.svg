imation:flowLine 20s linear infinite}.particle{animation:floatParticle 6s ease-in-out infinite}.p-slow{animation-duration:9s}.p-fast{animation-duration:4.5s}.floating-card{animation:cardFloat 6s ease-in-out infinite}.card-delay1{animation-delay:-2s}.card-delay2{animation-delay:-4s}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="g-glow1"><circle cx="220" cy="180" r="160" fill="#0284c7" filter="url(#softGlow)" opacity=".3"/></g><g class="g-glow2"><circle cx="980" cy="220" r="180" fill="#7c3aed" filter="url(#softGlow)" opacity=".25"/><circle cx="600" cy="360" r="140" fill="#0d9488" filter="url(#softGlow)" opacity=".2"/></g><path fill="none" stroke="#0ea5e9" stroke-width="2.5" d="M -50,310 C 200,240 400,380 700,290 C 950,220 1050,330 1250,260" class="flow-line" opacity=".35"/><path fill="none" stroke="#8b5cf6" stroke-width="2" d="M -50,110 C 250,180 500,70 800,160 C 1050,230 1100,100 1250,140" class="flow-line" opacity=".3" style="animation-direction:reverse;animation-duration:26s"/><circle cx="160" cy="80" r="3" fill="#38bdf8" class="particle p-slow"/><circle cx="340" cy="330" r="4" fill="#818cf8" class="particle"/><circle cx="820" cy="80" r="3.5" fill="#34d399" class="particle p-fast"/><circle cx="1060" cy="320" r="4.5" fill="#c084fc" class="particle p-slow"/><circle cx="520" cy="360" r="3" fill="#38bdf8" class="particle"/><g class="floating-card card-delay1"><rect width="220" height="42" x="80" y="325" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.2" rx="21"/><circle cx="102" cy="346" r="6" fill="#10b981" filter="url(#glow)"/><text x="118" y="352" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing=".3">✨ Waterfall Enrichment</text></g><g class="floating-card"><rect width="230" height="42" x="330" y="325" fill="url(#cardGrad)" stroke="#818cf8"